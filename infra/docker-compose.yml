name: infra
services:
  caddy:
    container_name: activites-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    container_name: activites-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: activite_db
      POSTGRES_PASSWORD: activite_password
      POSTGRES_USER: activite_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activite_user -d activite_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - activites_pg:/var/lib/postgresql/data

  web:
    env_file:
      - .env
    container_name: activites-web
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SECRET: "${AUTH_SECRET:-}"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://wadelo.com"
      DATABASE_URL: "postgresql://activite_user:activite_password@db:5432/activite_db?schema=public"
      NEXTAUTH_URL: "https://wadelo.com"
      NODE_ENV: production
    expose:
      - "3000"
    volumes:
      - activites_uploads:/app/public/uploads
      - activites_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  activites_pg:
    name: infra_activites_pg
  activites_uploads:
    name: infra_activites_uploads
  activites_data:
    name: infra_activites_data
  caddy_data:
    name: infra_caddy_data
  caddy_config:
    name: infra_caddy_config
